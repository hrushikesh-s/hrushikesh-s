name: Update GitLab MRs in Profile README

on:
  schedule:
    # 1 am, 7 am, 1 pm, and 7 pm PST (UTC-8)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitLab MRs and update README
        run: python3 .github/scripts/update_gitlab_mrs.py

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update GitLab merge requests"
            git push
          fi

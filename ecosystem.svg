<svg xmlns="http://www.w3.org/2000/svg" width="860" height="214" viewBox="0 0 860 214" role="img" aria-label="Open-source software ecosystem and live contributions">
<style>:root{--bg:#f6f8fa;--page:#ffffff;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--bar:#0f8a7e;--accent2:#0969da;--track:#e6ebf0}@media (prefers-color-scheme:dark){:root{--bg:#161b22;--page:#0d1117;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--bar:#2bc4b0;--accent2:#58a6ff;--track:#21262d}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.big{font-size:38px;font-weight:600;fill:var(--ink)}.label{font-size:13px;fill:var(--muted)}.head{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.08em}.repo{font-size:12.5px;fill:var(--ink)}.num{font-size:12.5px;font-weight:600;fill:var(--ink)}</style>
<rect x="0.5" y="0.5" width="859" height="213" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<text class="head" x="28" y="34">SOFTWARE ECOSYSTEM &amp; LIVE CONTRIBUTIONS</text>
<g transform="translate(28, 52)">
<rect x="0" y="0" width="184" height="134" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text x="14" y="24" fill="var(--muted)" font-size="10.5" font-weight="600" letter-spacing="0.6">PHYSICS &amp; MLIPS</text>
<text x="14" y="50" fill="var(--ink)" font-size="13" font-weight="600">Pheasy (GitLab)</text>
<text x="14" y="67" fill="var(--accent2)" font-size="11">3 merged · 2 in review</text>
<line x1="14" y1="80" x2="170" y2="80" stroke="var(--line)"/>
<text x="14" y="101" fill="var(--ink)" font-size="12.5">MACE-OMAT / Field</text>
<text x="14" y="118" fill="var(--muted)" font-size="11">Polar RASR · LASSO IFCs</text>
</g>
<path d="M 218 119 L 238 119 M 233 114 L 239 119 L 233 124" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
<g transform="translate(244, 52)">
<rect x="0" y="0" width="184" height="134" rx="8" fill="var(--page)" stroke="var(--bar)" stroke-width="1.5"/>
<text x="14" y="24" fill="var(--bar)" font-size="10.5" font-weight="600" letter-spacing="0.6">WORKFLOWS</text>
<text x="14" y="50" fill="var(--ink)" font-size="13" font-weight="600">atomate2</text>
<text x="14" y="67" fill="var(--bar)" font-size="11">29 merged · 16 in review</text>
<line x1="14" y1="80" x2="170" y2="80" stroke="var(--line)"/>
<text x="14" y="101" fill="var(--ink)" font-size="12">Phonons · CTE · DWF</text>
<text x="14" y="118" fill="var(--muted)" font-size="11">Finite-T · CALPHAD</text>
</g>
<path d="M 434 119 L 454 119 M 449 114 L 455 119 L 449 124" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
<g transform="translate(460, 52)">
<rect x="0" y="0" width="184" height="134" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text x="14" y="24" fill="var(--muted)" font-size="10.5" font-weight="600" letter-spacing="0.6">LIBRARIES &amp; SCHEMAS</text>
<text x="14" y="50" fill="var(--ink)" font-size="12.5">robocrystallographer <tspan fill="var(--bar)" font-size="11" font-weight="600">7</tspan></text>
<text x="14" y="72" fill="var(--ink)" font-size="12.5">matbench / alabos <tspan fill="var(--bar)" font-size="11" font-weight="600">4 / 4</tspan></text>
<text x="14" y="94" fill="var(--ink)" font-size="12.5">emmet <tspan fill="var(--bar)" font-size="11" font-weight="600">3</tspan></text>
<text x="14" y="116" fill="var(--ink)" font-size="12.5">pymatgen / jobflow <tspan fill="var(--bar)" font-size="11" font-weight="600">2 / 2</tspan></text>
</g>
<path d="M 650 119 L 670 119 M 665 114 L 671 119 L 665 124" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
<g transform="translate(676, 52)">
<rect x="0" y="0" width="156" height="134" rx="8" fill="var(--page)" stroke="var(--line)"/>
<text x="14" y="24" fill="var(--muted)" font-size="10.5" font-weight="600" letter-spacing="0.6">OPEN DATA</text>
<text x="14" y="56" fill="var(--ink)" font-size="22" font-weight="600">29,615</text>
<text x="14" y="74" fill="var(--muted)" font-size="11.5">MP phonon crystals</text>
<line x1="14" y1="86" x2="142" y2="86" stroke="var(--line)"/>
<text x="14" y="106" fill="var(--ink)" font-size="11.5">Zenodo v1.2 (124 GB)</text>
<text x="14" y="122" fill="var(--muted)" font-size="10.5">mp-api &amp; MP website</text>
</g>
</svg>
